services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: velora-frontend
    ports:
      - "${FRONTEND_PORT}:3000"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: velora-backend
    ports:
      - "${BACKEND_PORT}:5000"
    env_file:
      - .env
    environment:
      PORT: 5000
    restart: unless-stopped
